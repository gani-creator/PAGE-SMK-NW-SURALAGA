    const s = await F.getDocs(F.collection(F.db, col));
    return s.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async get(col, id) {
    if (IS_PREVIEW) return mem[col]?.[id] ? { id, ...clone(mem[col][id]) } : null;
    const s = await F.getDoc(F.doc(F.db, col, id));
    return s.exists() ? { id: s.id, ...s.data() } : null;
  },
  async set(col, id, data) {
    if (IS_PREVIEW) { mem[col] = mem[col] || {}; mem[col][id] = { ...(mem[col][id] || {}), ...clone(data) }; return; }
    await F.setDoc(F.doc(F.db, col, id), data, { merge: true });
  },
  async add(col, data) {
    if (IS_PREVIEW) { const id = uid(); mem[col][id] = clone(data); return id; }
    const r = await F.addDoc(F.collection(F.db, col), data); return r.id;
  },
  async update(col, id, data) {
    if (IS_PREVIEW) { Object.assign(mem[col][id], clone(data)); return; }
    await F.updateDoc(F.doc(F.db, col, id), data);
  },
  async remove(col, id) {
    if (IS_PREVIEW) { delete mem[col][id]; return; }
    await F.deleteDoc(F.doc(F.db, col, id));
  },
  async click(id) {
    if (IS_PREVIEW) { if (mem.links[id]) mem.links[id].klik = (mem.links[id].klik || 0) + 1; return; }
    await F.updateDoc(F.doc(F.db, 'links', id), { klik: F.increment(1) });
  }
};

/* =====================================================================
   AUTENTIKASI HYBRID
   Admin   : Firebase Authentication (Email & Password) + dokumen admins/{uid}
   Operator: username + password dicocokkan ke koleksi operators (Firestore)
   ===================================================================== */
const Auth = {
  async adminLogin(email, pw) {
    email = String(email || '').trim().toLowerCase();
    if (IS_PREVIEW) {
      if (email === DEMO.adminEmail && pw === DEMO.adminPass) return { role: 'admin', name: 'Admin Demo', email };
      throw new Error(`Aplikasi masih MODE PREVIEW (IS_PREVIEW = true), jadi akun Firebase belum dipakai. Gunakan akun demo ${DEMO.adminEmail} / ${DEMO.adminPass}, atau ubah IS_PREVIEW menjadi false untuk login dengan akun admin asli.`);
    }
    if (F.auth.currentUser) await F.signOut(F.auth);
    let cred;
    try { cred = await F.signInWithEmailAndPassword(F.auth, email, pw); } catch (e) { throw new Error(friendly(e)); }
    const id = cred.user.uid, ref = F.doc(F.db, 'admins', id);
    let a;
    try { a = await F.getDoc(ref); }
    catch (e) { await F.signOut(F.auth); throw new Error('Login berhasil, tetapi Firestore menolak akses. Pastikan isi firestore.rules sudah ditempel dan di-Publish di Firebase Console → Firestore → Rules.'); }
    if (!a.exists()) {
      // Daftarkan otomatis bila email ada di daftar adminEmails() pada firestore.rules
      try { await F.setDoc(ref, { email, nama: email, createdAt: Date.now() }); a = await F.getDoc(ref); } catch {}
    }
    if (!a.exists()) {
      await F.signOut(F.auth);
      throw new Error(`Email & password benar, tetapi akun belum terdaftar sebagai admin. Tambahkan "${email}" ke adminEmails() di firestore.rules lalu Publish, ATAU buat dokumen admins/${id} di Firestore. UID: ${id}`);
    }
    return { role: 'admin', name: a.data().nama || email, email, uid: id };
  },
  async operatorLogin(username, pw) {
    username = String(username || '').trim().toLowerCase();
    const hash = await sha256(pw);
    if (IS_PREVIEW) {
      const o = mem.operators[username];
      if (!o || o.passwordHash !== hash) throw new Error('Username atau password salah.');
      if (!o.aktif) throw new Error('Akun operator dinonaktifkan. Hubungi admin.');
      return { role: 'operator', name: o.nama, username, unitId: o.unitId, hash };
    }
    if (!/^[a-z0-9._-]{3,30}$/.test(username)) throw new Error('Username atau password salah.');
    if (F.auth.currentUser && !F.auth.currentUser.isAnonymous) await F.signOut(F.auth);
    try { if (!F.auth.currentUser) await F.signInAnonymously(F.auth); } catch (e) { throw new Error(friendly(e)); }
    const u = F.auth.currentUser.uid;
    try { await F.setDoc(F.doc(F.db, 'sessions', u), { username, passwordHash: hash, createdAt: Date.now() }); }
    catch (e) { throw new Error('Username atau password salah, atau akun dinonaktifkan.'); }
    const o = await F.getDoc(F.doc(F.db, 'operators', username));
    const d = o.data();
    return { role: 'operator', name: d.nama, username, unitId: d.unitId, uid: u, hash };
  },
  async restore() {
    if (IS_PREVIEW) return null;
    const user = await new Promise(r => { const off = F.onAuthStateChanged(F.auth, x => { off(); r(x); }); });
    if (!user) return null;
    try {
      if (!user.isAnonymous) {
        const a = await F.getDoc(F.doc(F.db, 'admins', user.uid));
        if (a.exists()) return { role: 'admin', name: a.data().nama || user.email, email: user.email, uid: user.uid };
        await F.signOut(F.auth); return null;
      }
      const s = await F.getDoc(F.doc(F.db, 'sessions', user.uid));
      if (!s.exists()) return null;
      const sd = s.data();
      const o = await F.getDoc(F.doc(F.db, 'operators', sd.username));
      if (!o.exists() || !o.data().aktif) return null;
      return { role: 'operator', name: o.data().nama, username: sd.username, unitId: o.data().unitId, uid: user.uid, hash: sd.passwordHash };
    } catch { return null; }
  },
  async logout() {
    if (IS_PREVIEW) return;
    try { if (S.session?.role === 'operator' && F.auth.currentUser) await F.deleteDoc(F.doc(F.db, 'sessions', F.auth.currentUser.uid)); } catch {}
    await F.signOut(F.auth);
  },
  async changePassword(oldPw, newPw) {
    const s = S.session;
    if ((await sha256(oldPw)) !== s.hash) throw new Error('Password lama salah.');
    const nh = await sha256(newPw);
    await DB.update('operators', s.username, { passwordHash: nh, updatedAt: Date.now() });
    if (!IS_PREVIEW) await F.setDoc(F.doc(F.db, 'sessions', F.auth.currentUser.uid), { username: s.username, passwordHash: nh, createdAt: Date.now() });
    s.hash = nh;
  }
};

function fieldHTML(f, v) {

  const req = f.req ? ' required' : '';
  if (f.type === 'toggle') return `<div class="${cls}"><label class="tg"><span class="tg-t">${esc(f.label)}</span><input class="tg-in" type="checkbox" name="${f.k}"${val ? ' checked' : ''}><span class="tg-st"></span><span class="tg-sw"><span class="tg-k"></span></span></label></div>`;
  let ctl;

  else if (f.type === 'textarea') ctl = `<textarea class="inp" name="${f.k}" placeholder="${esc(f.ph || '')}"${req}>${esc(val)}</textarea>`;

  return `<div class="${cls}"><label>${esc(f.label)}</label>${ctl}${hint}</div>`;
}
function collect(form, fields) {
  const o = {};
  fields.forEach(f => {
    if (f.type === 'section' || f.ro) return;
    const el = form.elements[f.k]; if (!el) return;
    if (f.type === 'toggle') o[f.k] = el.checked;
    else if (f.type === 'number') o[f.k] = Number(el.value || 0);
    else o[f.k] = el.value.trim();
  });
  return o;
}

function linkBase() {
  let L = scoped(S.links);
  if (isAdmin() && S.unitF !== 'all') L = L.filter(l => (l.unitId || '') === S.unitF);
  return L.sort(byOrder);
}
function linkRows() {
  const base = linkBase();
  const q = S.q.toLowerCase();
  const L = q ? base.filter(l => (l.judul + ' ' + l.url).toLowerCase().includes(q)) : base;
  if (!L.length) return emptyHTML('link', q ? 'Tidak ditemukan' : 'Belum ada data', q ? ' Coba kata kunci lain.' : ' Klik "Tambah Link" untuk mulai.');
  return `<div class="rows">${L.map(l => { const i = base.indexOf(l); return `<div class="row${l.aktif ? '' : ' dim'}">
    <span class="ti">${ic(l.ikon)}</span>
    <div class="tx"><b>${esc(l.judul)}</b><small>${esc(l.url)}</small><div class="tags"><span class="tag g">${esc(unitName(l.unitId))}</span><span class="tag">${fmtNum(l.klik)} klik</span>${l.highlight ? '<span class="tag y">Disorot</span>' : ''}${l.aktif ? '' : '<span class="tag r">Disembunyikan</span>'}</div></div>
    <div class="acts">
      <button class="ib" data-act="moveLink" data-id="${esc(l.id)}" data-v="-1" title="Naik"${q || i === 0 ? ' disabled' : ''}>${ic('up')}</button>
      <button class="ib" data-act="moveLink" data-id="${esc(l.id)}" data-v="1" title="Turun"${q || i === base.length - 1 ? ' disabled' : ''}>${ic('down')}</button>
      <button class="ib${l.highlight ? ' on' : ''}" data-act="togLink" data-id="${esc(l.id)}" data-v="highlight" title="Sorot">${ic('star')}</button>
      <button class="ib${l.aktif ? '' : ' off'}" data-act="togLink" data-id="${esc(l.id)}" data-v="aktif" title="Tampil/sembunyi">${ic(l.aktif ? 'eye' : 'eyeoff')}</button>
      <button class="ib" data-act="editLink" data-id="${esc(l.id)}" title="Ubah">${ic('edit')}</button>
      <button class="ib dan" data-act="delLink" data-id="${esc(l.id)}" title="Hapus">${ic('trash')}</button>
    </div></div>`; }).join('')}</div>`;
}

function cleanLink(v) {
  const url = normUrl(v.url);
  if (!url) throw new Error('URL tidak valid. Gunakan http(s)://, mailto: atau tel:');
  const o = { judul: v.judul, url, ikon: v.ikon, urutan: v.urutan, highlight: v.highlight, aktif: v.aktif, unitId: isAdmin() ? (v.unitId || '') : S.session.unitId, updatedAt: Date.now() };
  return o;
}
function cleanAnn(v) {
  if (v.mulai && v.selesai && v.selesai < v.mulai) throw new Error('Tanggal selesai tidak boleh sebelum tanggal mulai.');
  return { judul: v.judul, isi: v.isi, mulai: v.mulai || '', selesai: v.selesai || '', aktif: v.aktif, unitId: isAdmin() ? (v.unitId || '') : S.session.unitId, updatedAt: Date.now() };
}

const findIn = (arr, id) => arr.find(x => x.id === id);

  editLink: d => { const l = findIn(S.links, d.id); if (!canEdit(l)) return;
    openForm({ title: 'Ubah Link', fields: linkFields(), values: isAdmin() ? l : { ...l, unitId: unitName(l.unitId) }, onSubmit: async v => { await DB.update('links', l.id, cleanLink(v)); await reload('links'); closeModal(); renderPage(); toast('Link diperbarui'); } }); },
  delLink: d => { const l = findIn(S.links, d.id); if (!canEdit(l)) return;
    confirmBox('Hapus link?', `"${esc(l.judul)}" akan dihapus permanen beserta data kliknya.`, async () => { await DB.remove('links', l.id); await reload('links'); renderPage(); toast('Link dihapus'); }); },
  togLink: async d => { const l = findIn(S.links, d.id); if (!canEdit(l)) return;
    try { await DB.update('links', l.id, { [d.v]: !l[d.v], updatedAt: Date.now() }); await reload('links'); renderPage(); } catch (e) { toast(friendly(e), true); } },
  moveLink: async d => {
    const base = linkBase(); const i = base.findIndex(x => x.id === d.id); const j = i + Number(d.v);
    if (i < 0 || j < 0 || j >= base.length) return;
    [base[i], base[j]] = [base[j], base[i]];
    try { await Promise.all(base.map((l, k) => l.urutan !== k + 1 ? DB.update('links', l.id, { urutan: k + 1 }) : null)); await reload('links'); renderPage(); }
    catch (e) { toast(friendly(e), true); }
  },

  delUnit: d => { const u = findIn(S.units, d.id);

  addAnn: () => openForm({ title: 'Tambah Pengumuman', fields: annFields(), onSubmit: async v => { await DB.add('announcements', { ...cleanAnn(v), createdBy: S.session.username || S.session.email || 'admin', createdAt: Date.now() }); await reload('announcements'); closeModal(); renderPage(); toast('Pengumuman ditambahkan'); } }),
  editAnn: d => { const a = findIn(S.ann, d.id); if (!canEdit(a)) return;

  togAnn: async d => { const a = findIn(S.ann, d.id); if (!canEdit(a)) return;

  delAnn: d => { const a = findIn(S.ann, d.id); if (!canEdit(a)) return;
    confirmBox('Hapus pengumuman?', `"${esc(a.judul)}" akan dihapus permanen.`, async () => { await DB.remove('announcements', a.id); await reload('announcements'); renderPage(); toast('Pengumuman dihapus'); }); },

  addOp: () => {
    if (!S.units.length) return toast('Buat minimal satu Unit terlebih dahulu.', true);
    openForm({ title: 'Tambah Operator', fields: [
      { k: 'nama', label: 'Nama Operator', req: true, full: true },
      { k: 'username', label: 'Username', req: true, pattern: '[a-z0-9._\\-]{3,30}', hint: 'Huruf kecil/angka/titik, 3–30 karakter' },
      { k: 'password', label: 'Password', type: 'password', req: true, min: 6, hint: 'Minimal 6 karakter' },
      { k: 'unitId', label: 'Unit', type: 'select', options: unitOpts(false), full: true },
      { k: 'aktif', label: 'Akun aktif', type: 'toggle', def: true, full: true }
    ], onSubmit: async v => {
      const un = v.username.toLowerCase();
      if (!/^[a-z0-9._-]{3,30}$/.test(un)) throw new Error('Username tidak valid.');
      if (await DB.get('operators', un)) throw new Error('Username sudah dipakai.');

    } });
  },
  editOp: d => { const o = findIn(S.operators, d.id);

  togOp: async d => { const o = findIn(S.operators, d.id);

};

const FORMS = {
  dyn: async form => { await dynForm.onSubmit(collect(form, dynForm.fields), form); },
  login: async form => {
    const s = S.loginTab === 'admin'
      ? await Auth.adminLogin(form.elements.email.value.trim(), form.elements.password.value)
      : await Auth.operatorLogin(form.elements.username.value, form.elements.password.value);
    S.session = s; closeModal(); S.view = 'panel'; S.page = 'dashboard';
    await loadPanel(); render(); appEl.scrollTop = 0; toast('Selamat datang, ' + s.name);
  },
  profile: async form => {
    const v = collect(form, PROFILE_FIELDS);

/* ---------- PROSES FORM (tahan banting: tidak bergantung pada validasi bawaan browser,
   berfungsi di Blogger, Instagram/TikTok in-app browser, dan WebView Android) ---------- */
function validateForm(form) {
  for (const el of form.querySelectorAll('input,select,textarea')) {
    if (el.type === 'hidden' || el.type === 'checkbox' || el.readOnly) continue;
    const label = el.closest('.fl')?.querySelector('label')?.textContent?.trim().replace(/\s*\*$/, '') || el.name;
    const v = (el.value || '').trim();
    if (el.required && !v) return `Kolom "${label}" wajib diisi.`;
    if (!v) continue;
    if (el.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `Format "${label}" tidak valid (contoh: nama@domain.com).`;
    if (el.type === 'tel' && !/^[0-9+\-\s()]{8,20}$/.test(v)) return `"${label}" harus berupa nomor HP yang valid.`;
    if (el.type === 'number' && isNaN(Number(v))) return `"${label}" harus berupa angka.`;
    if (el.type === 'url' && !/^https?:\/\/\S+$/i.test(v)) return `"${label}" harus diawali http:// atau https://`;
    const min = Number(el.getAttribute('minlength') || 0);
    if (min && el.value.length < min) return `"${label}" minimal ${min} karakter.`;
    const pat = el.getAttribute('pattern');
    if (pat && !new RegExp('^(?:' + pat + ')$').test(v)) return `Format "${label}" tidak valid.`;
  }
  return '';
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('Server tidak merespons. Periksa koneksi internet, firebaseConfig, dan pastikan domain blog sudah ada di Authorized domains Firebase.')), ms))]);
async function runForm(form) {
  if (!form || form.dataset.busy === '1') return;
  const h = FORMS[form.dataset.form]; if (!h) return;
  form.querySelector('.err')?.remove();
  const showErr = msg => { form.insertAdjacentHTML('afterbegin', `<div class="err">${esc(msg)}</div>`); form.querySelector('.err')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  const bad = validateForm(form);
  if (bad) return showErr(bad);
  const btn = form.querySelector('[type=submit]'), old = btn ? btn.innerHTML : '';
  form.dataset.busy = '1';
  if (btn) { btn.disabled = true; btn.innerHTML = 'Memproses…'; }
  try { await withTimeout(h(form), 25000); }
  catch (err) { if (form.isConnected) showErr(friendly(err)); else toast(friendly(err), true); }
  finally { form.dataset.busy = ''; if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('File bukan gambar yang valid.')); }; im.src = u; });
}
async function compressImage(file, W, H, maxLen) {
  if (!/^image\//.test(file.type)) throw new Error('File harus berupa gambar (JPG, PNG, WebP).');
  if (file.size > 20 * 1024 * 1024) throw new Error('Ukuran file maksimal 20 MB.');
  const im = await loadImg(file);
  const r = Math.max(W / im.naturalWidth, H / im.naturalHeight);
  const sw = W / r, sh = H / r, sx = (im.naturalWidth - sw) / 2, sy = (im.naturalHeight - sh) / 2;
  let scale = 1;
  for (let attempt = 0; attempt < 8; attempt++) {
    const cw = Math.max(64, Math.round(W * scale)), ch = Math.max(Math.round(64 * H / W), Math.round(H * scale));
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
    x.drawImage(im, sx, sy, sw, sh, 0, 0, cw, ch);
    for (const q of [0.85, 0.75, 0.65, 0.55]) {
      let d = c.toDataURL('image/webp', q);
      if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', q);
      if (d.length <= maxLen) return d;
    }
    scale *= 0.8;
  }
  throw new Error('Gambar tidak bisa dikompres cukup kecil. Coba gambar lain.');
}

  { k: 'kontakWa', label: 'No. WhatsApp Panitia', ph: '08xxxxxxxxxx' },
  { k: 'brosurUrl', label: 'Link Brosur (opsional)', type: 'url', full: true, ph: 'https://…' }
];
PAGES.spmb = function () {
  const t = S.spmbAdm;
  const tabs = `<div class="tabs t3"><button class="tab${t === 'set' ? ' on' : ''}" data-act="spmbAdm" data-v="set">Pengaturan</button><button class="tab${t === 'form' ? ' on' : ''}" data-act="spmbAdm" data-v="form">Formulir</button><button class="tab${t === 'data' ? ' on' : ''}" data-act="spmbAdm" data-v="data">Pendaftar (${S.pendaftar.length})</button></div>`;
  const [st, c] = spmbStatus();
  const head = `<div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="ti">${ic('school')}</span><div style="flex:1;min-width:180px"><b>${esc(S.spmb.judul || 'SPMB belum diatur')}</b><div class="tags"><span class="tag ${c}">${st}</span><span class="tag">${S.spmb.mode === 'internal' ? 'Formulir bawaan' : 'Google Form'}</span>${S.spmb.tampil ? '<span class="tag g">Tampil di beranda</span>' : '<span class="tag">Tidak tampil di beranda</span>'}</div></div><button class="btn btn-g btn-s" data-act="openSpmb" data-v="daftar">${ic('eye')}Lihat Halaman SPMB</button></div>`;
  if (t === 'set') {
    const v = { mode: 'gform', ...S.spmb };
    return head + tabs + `<div class="card"><form data-form="spmbSet" novalidate><div class="fgrid">${SPMB_SET_FIELDS.map(f => fieldHTML(f, v[f.k])).join('')}</div><div class="sf"><button type="submit" class="btn btn-p">${ic('check')}Simpan Pengaturan</button></div></form></div>`;
  }
  if (t === 'form') {
    const F = spmbFields();
    return head + tabs + `${S.spmb.mode !== 'internal' ? `<div class="note" style="margin-bottom:14px">Mode saat ini <b>Google Form</b>. Formulir di bawah dipakai bila mode diubah ke "Formulir bawaan aplikasi" di tab Pengaturan. Susun pertanyaannya mengikuti Google Form Anda.</div>` : ''}
    <div class="tool"><div style="flex:1"></div><button class="btn btn-g" data-act="spmbTemplate">${ic('file')}Muat Template Standar</button><button class="btn btn-p" data-act="spmbAddQ">${ic('plus')}Tambah Pertanyaan</button></div>
    <div class="rows">${F.length ? F.map((f, i) => `<div class="row${f.type === 'section' ? ' secrow' : ''}"><span class="ti">${ic(SPMB_TYPE_ICON[f.type] || 'edit')}</span><div class="tx"><b>${esc(f.label)}</b><div class="tags"><span class="tag">${esc((SPMB_TYPES.find(x => x[0] === f.type) || ['', f.type])[1])}</span>${f.req ? '<span class="tag r">Wajib</span>' : ''}${f.type === 'select' ? `<span class="tag">${lines(f.options).length} opsi</span>` : ''}</div></div>
      <div class="acts"><button class="ib" data-act="spmbMoveQ" data-v="-1" data-i="${i}"${i === 0 ? ' disabled' : ''} title="Naik">${ic('up')}</button><button class="ib" data-act="spmbMoveQ" data-v="1" data-i="${i}"${i === F.length - 1 ? ' disabled' : ''} title="Turun">${ic('down')}</button><button class="ib" data-act="spmbEditQ" data-i="${i}" title="Ubah">${ic('edit')}</button><button class="ib dan" data-act="spmbDelQ" data-i="${i}" title="Hapus">${ic('trash')}</button></div></div>`).join('') : emptyHTML('clipboard', 'Belum ada data', ' Klik "Muat Template Standar" atau tambahkan pertanyaan satu per satu.')}</div>`;
  }
  // Data pendaftar
  const P = S.pendaftar;
  const cnt = k => P.filter(p => (p.status || 'baru') === k).length;
  const J = spmbJurusan();
  const per = {}; P.forEach(p => { const k = p.jurusan || '(Belum memilih)'; per[k] = (per[k] || 0) + 1; });
  const keys = [...new Set([...J.map(j => j.nama), ...Object.keys(per)])];
  return head + tabs + `<div class="stats">${[['users', 'Total Pendaftar', P.length, ''], ['info', 'Baru', cnt('baru'), 'y'], ['check', 'Diterima', cnt('diterima'), ''], ['x', 'Ditolak', cnt('ditolak'), 'y']].map(([i, l, v, y]) => `<div class="card stat"><div class="si ${y}">${ic(i)}</div><b>${fmtNum(v)}</b><span>${l}</span></div>`).join('')}</div>
    ${keys.length ? `<div class="card" style="margin-bottom:16px"><div class="ch">Rekap per Jurusan</div>${keys.map(k => { const q = J.find(j => j.nama === k)?.kuota || 0, n = per[k] || 0; return `<div class="bar"><div class="bt"><span>${esc(k)}</span><b>${n}${q ? ' / ' + q : ''}</b></div><div class="track"><div class="fill" style="width:${q ? Math.min(100, n / q * 100) : (n ? 100 : 0)}%"></div></div></div>`; }).join('')}</div>` : ''}
    <div class="tool"><input class="inp" type="search" placeholder="Cari nama / nomor pendaftaran…" value="${esc(S.pq)}" data-input="pq">
      <select class="inp" data-input="pst"><option value="all">Semua status</option>${SPMB_STATUS.map(([k, l]) => `<option value="${k}"${S.pst === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <button class="btn btn-g" data-act="spmbCsv">${ic('file')}Unduh CSV</button></div>
    <div id="plist">${pendaftarRows()}</div>`;
};
function pendaftarRows() {
  const q = S.pq.toLowerCase();
  const P = [...S.pendaftar].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
    .filter(p => S.pst === 'all' || (p.status || 'baru') === S.pst)
    .filter(p => !q || `${p.nama} ${p.noDaftar} ${p.jurusan}`.toLowerCase().includes(q));
  if (!P.length) return emptyHTML('users', S.pendaftar.length ? 'Tidak ditemukan' : 'Belum ada data', S.pendaftar.length ? ' Ubah kata kunci atau filter.' : ' Pendaftar dari formulir bawaan akan muncul di sini.');
  return `<div class="rows">${P.map(p => { const [, l, c] = stLabel(p.status); return `<div class="row"><div class="av">${esc(initials(p.nama))}</div><div class="tx"><b>${esc(p.nama || '(tanpa nama)')}</b><small>${esc(p.noDaftar)} · ${esc(p.jurusan || '-')} · ${p.createdAt ? new Date(p.createdAt).toLocaleDateString('id-ID') : ''}</small><div class="tags"><span class="tag ${c}">${l}</span>${p.catatan ? '<span class="tag">Ada catatan</span>' : ''}</div></div><div class="acts"><button class="ib" data-act="spmbDetail" data-id="${esc(p.id)}" title="Detail & status">${ic('eye')}</button><button class="ib dan" data-act="spmbDelP" data-id="${esc(p.id)}" title="Hapus">${ic('trash')}</button></div></div>`; }).join('')}</div>`;
}
async function saveSpmbFields(F) { await DB.set('settings', 'spmb', { fields: F, updatedAt: Date.now() }); S.spmb = (await DB.get('settings', 'spmb')) || { ...S.spmb, fields: F }; renderPage(); }
function qFields() {
  return [
    { k: 'label', label: 'Pertanyaan / Judul Bagian', req: true, full: true },
    { k: 'type', label: 'Tipe Isian', type: 'select', options: SPMB_TYPES },
    { k: 'ph', label: 'Contoh isian (placeholder)', ph: 'opsional' },
    { k: 'options', label: 'Opsi Pilihan', type: 'textarea', full: true, hint: 'Khusus tipe "Pilihan (dropdown)": satu opsi per baris. Tipe "Pilihan Jurusan" otomatis memakai daftar jurusan.' },
    { k: 'req', label: 'Wajib diisi', type: 'toggle', full: true }
  ];
}
function uniqueQId(label) {
  const base = (slugify(label).replace(/-/g, '_') || 'q').slice(0, 30), ids = spmbFields().map(f => f.id);
  let id = base, n = 2; while (ids.includes(id)) id = base + '_' + n++;
  return id;
}
function downloadCsv() {
  const F = spmbFields().filter(f => f.type !== 'section');
  const head = ['No. Pendaftaran', 'Tanggal Daftar', 'Status', 'Catatan', ...F.map(f => f.label)];
  const extra = [...new Set(S.pendaftar.flatMap(p => Object.keys(p.data || {})))].filter(k => !F.some(f => f.id === k));
  const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [...S.pendaftar].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).map(p => [p.noDaftar, p.createdAt ? new Date(p.createdAt).toLocaleString('id-ID') : '', stLabel(p.status)[1], p.catatan, ...F.map(f => p.data?.[f.id]), ...extra.map(k => p.data?.[k])]);
  const csv = '﻿' + [[...head, ...extra], ...rows].map(r => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `pendaftar-spmb-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function goSpmb(tab = 'info') {
  S.view = 'spmb'; S.spmbTab = tab;
  if (location.hash !== '#spmb') { try { history.pushState(null, '', '#spmb'); } catch {} }
  render(); appEl.scrollTop = 0;
}
function leaveSpmb() {
  if (location.hash === '#spmb') { try { history.replaceState(null, '', location.pathname + location.search); } catch {} }
}
window.addEventListener('popstate', () => {
  if (location.hash === '#spmb') { S.view = 'spmb'; S.spmbTab = S.spmbTab || 'info'; render(); }
  else if (S.view === 'spmb') { S.view = 'public'; render(); }
});

Object.assign(ACT, {
  openSpmb: d => { S.spmbFromPanel = S.view === 'panel'; goSpmb(d.v || 'info'); },
  spmbTab: d => { S.spmbTab = d.v; renderSpmb(); const t = appEl.querySelector('.sp-tabs'); if (t && appEl.scrollTop > t.offsetTop) appEl.scrollTop = t.offsetTop - 8; },
  spmbBack: () => { leaveSpmb(); S.view = S.session && S.spmbFromPanel ? 'panel' : 'public'; S.spmbFromPanel = false; render(); appEl.scrollTop = 0; },
  spmbAgain: () => { S.spmbDone = null; renderSpmb(); appEl.scrollTop = 0; },
  spmbAdm: d => { S.spmbAdm = d.v; renderPage(); },
  spmbTemplate: () => {
    const run = async () => { await saveSpmbFields(SPMB_TEMPLATE.map(f => ({ ...f }))); toast('Template standar dimuat'); };
    if (!spmbFields().length) return run();
    confirmBox('Ganti dengan template?', 'Semua pertanyaan formulir saat ini akan diganti dengan template standar PPDB.', async () => { await run(); }, 'Ganti');
  },
  spmbAddQ: () => openForm({ title: 'Tambah Pertanyaan', fields: qFields(), values: { type: 'text' }, onSubmit: async v => {
    if (v.type === 'select' && !lines(v.options).length) throw new Error('Isi minimal satu opsi pilihan.');
    await saveSpmbFields([...spmbFields(), { id: uniqueQId(v.label), ...v }]); closeModal(); toast('Pertanyaan ditambahkan'); } }),
  spmbEditQ: d => { const i = +d.i, f = spmbFields()[i];
    openForm({ title: 'Ubah Pertanyaan', fields: qFields(), values: f, onSubmit: async v => {
      if (v.type === 'select' && !lines(v.options).length) throw new Error('Isi minimal satu opsi pilihan.');
      const F = [...spmbFields()]; F[i] = { ...f, ...v }; await saveSpmbFields(F); closeModal(); toast('Pertanyaan diperbarui'); } }); },
  spmbMoveQ: async d => { const i = +d.i, j = i + Number(d.v), F = [...spmbFields()]; if (j < 0 || j >= F.length) return; [F[i], F[j]] = [F[j], F[i]]; await saveSpmbFields(F); },
  spmbDelQ: d => { const i = +d.i, f = spmbFields()[i];
    confirmBox('Hapus pertanyaan?', `"${esc(f.label)}" akan dihapus dari formulir. Data pendaftar yang sudah masuk tetap tersimpan.`, async () => { await saveSpmbFields(spmbFields().filter((_, k) => k !== i)); toast('Pertanyaan dihapus'); }); },
  spmbDetail: d => { const p = findIn(S.pendaftar, d.id); if (!p) return;
    const F = spmbFields(); const known = new Set(F.map(f => f.id));
    const rowsHtml = F.map(f => f.type === 'section' ? `<div class="sec" style="margin:4px 0 2px">${esc(f.label)}</div>` : `<div class="kv"><small>${esc(f.label)}</small><b>${esc(f.type === 'date' && p.data?.[f.id] ? fmtDate(p.data[f.id]) : (p.data?.[f.id] || '-'))}</b></div>`).join('')
      + Object.keys(p.data || {}).filter(k => !known.has(k)).map(k => `<div class="kv"><small>${esc(k)}</small><b>${esc(p.data[k] || '-')}</b></div>`).join('');
    const tel = F.filter(f => f.type === 'tel').map(f => p.data?.[f.id]).find(Boolean);
    const html = `<div class="kvbox"><div class="kv"><small>No. Pendaftaran</small><b>${esc(p.noDaftar)}</b></div><div class="kv"><small>Tanggal Daftar</small><b>${p.createdAt ? new Date(p.createdAt).toLocaleString('id-ID') : '-'}</b></div>${rowsHtml}</div>${tel ? `<a class="btn btn-g btn-s" style="margin-top:10px" href="${esc(waLink(tel))}" target="_blank" rel="noopener">${ic('wa')}Chat WA ${esc(tel)}</a>` : ''}`;
    openForm({ title: 'Detail Pendaftar', submit: 'Simpan Status', values: p, fields: [
      { type: 'html', html, full: true }, { type: 'section', label: 'Verifikasi Panitia' },
      { k: 'status', label: 'Status', type: 'select', options: SPMB_STATUS.map(([k, l]) => [k, l]), full: true },
      { k: 'catatan', label: 'Catatan Panitia', type: 'textarea', full: true }
    ], onSubmit: async v => { await DB.update('pendaftar', p.id, { status: v.status, catatan: v.catatan, updatedAt: Date.now() }); await reload('pendaftar'); closeModal(); renderPage(); toast('Status pendaftar disimpan'); } }); },
  spmbDelP: d => { const p = findIn(S.pendaftar, d.id);
    confirmBox('Hapus pendaftar?', `Data "${esc(p.nama)}" (${esc(p.noDaftar)}) akan dihapus permanen.`, async () => { await DB.remove('pendaftar', p.id); await reload('pendaftar'); renderPage(); toast('Pendaftar dihapus'); }); },
  spmbCsv: () => { if (!S.pendaftar.length) return toast('Belum ada data pendaftar.', true); downloadCsv(); }
});

Object.assign(FORMS, {
  spmbSet: async form => {
    const v = collect(form, SPMB_SET_FIELDS);
    if (v.gformUrl) { const u = normUrl(v.gformUrl); if (!u || !/^https:/i.test(u)) throw new Error('Link Google Form harus diawali https://'); v.gformUrl = u; }
    if (v.brosurUrl) { const u = normUrl(v.brosurUrl); if (!u) throw new Error('Link brosur tidak valid.'); v.brosurUrl = u; }
    if (v.mode === 'gform' && v.buka && !v.gformUrl) throw new Error('Mode Google Form dipilih tetapi link Google Form masih kosong.');
    if (v.tglBuka && v.tglTutup && v.tglTutup < v.tglBuka) throw new Error('Tanggal ditutup tidak boleh sebelum tanggal dibuka.');
    await DB.set('settings', 'spmb', { ...v, updatedAt: Date.now() });
    S.spmb = (await DB.get('settings', 'spmb')) || { ...S.spmb, ...v };
    renderPage(); toast('Pengaturan SPMB disimpan');
  },
  spmbReg: async form => {
    const sp = S.spmb || {};
    if (!spmbStatus()[2] || sp.mode !== 'internal') throw new Error('Pendaftaran sedang ditutup.');
    const F = spmbFields().filter(f => f.type !== 'section');
    const data = {};
    F.forEach(f => { data[f.id] = String(form.elements['f_' + f.id]?.value || '').trim().slice(0, 1000); });
    const jf = F.find(f => f.type === 'jurusan');
    const nama = (data.nama || data[F.find(f => f.type === 'text')?.id] || '').slice(0, 120);
    const no = genNo();
    await DB.add('pendaftar', { noDaftar: no, data, nama, jurusan: (jf ? data[jf.id] : '').slice(0, 120), status: 'baru', catatan: '', createdAt: Date.now() });
    if (isAdmin()) await reload('pendaftar').catch(() => {});
    S.spmbDone = { no, nama }; renderSpmb(); appEl.scrollTop = 0;
  }
});

function render() {
  if (S.fatal) { viewEl.innerHTML = `<div class="fatal"><div class="card">${emptyHTML('info', 'Gagal memuat aplikasi', '')}<p style="color:var(--mu);font-size:13px;margin-top:-20px">${esc(S.fatal)}</p><button class="btn btn-p" style="margin-top:16px" onclick="location.reload()">Muat Ulang</button></div></div>`; return; }
  if (S.view === 'spmb' && !S.loading) renderSpmb();
  else if (S.view === 'panel' && S.session) renderPanel(); else renderPublic();
}

/* =====================================================================
   PWA: MANIFEST (DATA URI) + SERVICE WORKER (BLOB)
   ===================================================================== */
function setupPWA() {
  try {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0F7A3E"/><text x="256" y="320" font-family="Arial,Helvetica,sans-serif" font-size="200" font-weight="700" fill="#fff" text-anchor="middle">NW</text></svg>`;
    const icon = 'data:image/svg+xml,' + encodeURIComponent(svg);
    const httpOrigin = /^https?:/.test(location.protocol);
    const manifest = { name: 'SMK NW Suralaga', short_name: 'SMK NW', description: 'Link resmi SMK NW Suralaga', display: 'standalone', background_color: '#FFFFFF', theme_color: '#0F7A3E', icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }] };
    if (httpOrigin) { manifest.start_url = location.href.split('#')[0]; manifest.scope = location.origin + '/'; }
    let l = document.getElementById('pwa-manifest');
    if (!l) { l = document.createElement('link'); l.rel = 'manifest'; l.id = 'pwa-manifest'; }
    l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(l);
    const ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; ap.href = icon; document.head.appendChild(ap);
    if (!document.querySelector('meta[name="theme-color"]')) { const m = document.createElement('meta'); m.name = 'theme-color'; m.content = '#0F7A3E'; document.head.appendChild(m); }
  } catch {}
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    try {
      const sw = `const C='smknw-linkinbio-v1';
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;const u=new URL(r.url);
if(u.origin!==self.location.origin&&!/fonts\\.(googleapis|gstatic)\\.com$/.test(u.hostname))return;
e.respondWith(fetch(r).then(res=>{const c=res.clone();caches.open(C).then(x=>x.put(r,c)).catch(()=>{});return res;}).catch(()=>caches.match(r)));});`;
      const url = URL.createObjectURL(new Blob([sw], { type: 'text/javascript' }));
      navigator.serviceWorker.register(url).catch(() => {});
    } catch {}
  }
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  // Tampil penuh layar menutupi elemen bawaan Blogger
  document.body.appendChild(appEl);
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  if (IS_PREVIEW) appEl.classList.add('pvon');
  setupPWA();
  render();
  try {
    if (IS_PREVIEW) await seedPreview();
    else { await initFirebase(); S.session = await Auth.restore(); }
    await loadPublic();
    if (location.hash === '#spmb') S.view = 'spmb';
  } catch (e) {
    S.fatal = IS_PREVIEW ? friendly(e) : 'Tidak dapat terhubung ke Firebase. Periksa firebaseConfig, aturan keamanan, dan koneksi internet. (' + friendly(e) + ')';
  }
  S.loading = false;
  render();
}
boot();
